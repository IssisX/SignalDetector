name: Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'bootstrap/**'
      - '.github/workflows/bootstrap-signal-hunter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          sdkmanager --install \
            'platforms;android-35' \
            'build-tools;35.0.0'
          yes | sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run dependency-free core tests
        run: bash tools/test-core.sh
      - name: Compile debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native analyst interaction test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb shell wm size 1280x720
            adb shell wm density 160
            adb install -g app/build/outputs/apk/debug/app-debug.apk
            adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.cory.signalhunter.test/com.cory.signalhunter.AnalystInstrumentation | tee analyst-test.txt
            grep -q ANALYST_PASS analyst-test.txt
            adb exec-out run-as com.cory.signalhunter cat files/analyst.png > analyst.png
      - name: Validate APK package and signature
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.cory.signalhunter'" \
            apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SignalHunter-debug-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-badging.txt
            apk-sha256.txt
            analyst-test.txt
            analyst.png
          if-no-files-found: error
          retention-days: 30
