name: Bootstrap Signal Hunter Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-signal-hunter.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_SHA256: e57d655ad119cebe38b33270a5e356ce372432fbcaa02f3130c62680e6b3136e

jobs:
  bootstrap-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout SignalDetector
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact verified source archive
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/chunk-sha256 <<'EOF'
          9c6256f87876387c37812c69dd5d0554810c748b9d6f76cb9007f55facc408db  bootstrap/p00
          e738efc19ceb7b44acad7c46ac51e65bf2797a291035195a0df81a1d2fad36db  bootstrap/p01
          89a193740aa83a7d07455a02402054f3cb240a218360fa9e685fbe904212cd99  bootstrap/p02
          98f28194f32a1514519e6d2c5cbdd6080476597cee076afe331ddac7bf2f5a9c  bootstrap/p03
          4dcafc5c22f108ac5cc337e9a61738cada3d108b2c001bb6087cc71c8d1a0c39  bootstrap/p04
          df29955125f6ce552fba0a82be66001dadcbd13cb6779d8c89e766a1c7e23d9b  bootstrap/p05
          d86275bc4e59863e1cd5a827c39edee89fe4de6db18d3c7c66092b7a0c65a408  bootstrap/p06
          bdd7211712a55b88372d14922bb358ef6a6b6dd580d5175c2ad6b9fa558b1cba  bootstrap/p07
          724ded7338ba5cb07e121492331357aa300fa8fa125976cbb73501b81f29adbc  bootstrap/p08
          0e62df65510d22b8fbccda5b3dfa9b107f9c60478750589350a5c8f6eb5df2dd  bootstrap/p09
          02b7b09b6f68ec81a88bcc0785e6e5ba4b7f83f4dcf88731731f5dd1ea599820  bootstrap/p10
          cc8014cda31454330bd72d2efc1f854e6b26858ec6eb6414a864e7a02c47e147  bootstrap/p11
          30de254c1a03becf5e4f099b38e937cf802a12f1bc1e7be2e2aca1fba21256ae  bootstrap/p12
          8debba2efc155cf1834ccaa8bdc86e107be6e900d199f6f65540161a49951c46  bootstrap/p13
          c0372915b464fe93a1764ece19227d5398fa59c0e4d9e75acdcb3f5d78056855  bootstrap/p14
          49ee756e51b80014eadcaad9263b363f3661676aa92431d983ecd2d7a71831c4  bootstrap/p15
          0d9ee8df8244d2dfc42cf3b08ffb69aa98ba2bbd93d21b36935e9d4333d0b970  bootstrap/p16
          EOF
          sha256sum --check --strict /tmp/chunk-sha256
          cat bootstrap/p{00..16} > /tmp/SignalHunter-source.b64
          base64 --decode /tmp/SignalHunter-source.b64 \
            > /tmp/SignalHunter-v0.1.0-source.zip
          echo "${SOURCE_SHA256}  /tmp/SignalHunter-v0.1.0-source.zip" \
            | sha256sum --check --strict
          rm -rf /tmp/signal-src
          mkdir -p /tmp/signal-src
          unzip -q /tmp/SignalHunter-v0.1.0-source.zip -d /tmp/signal-src
          test -f /tmp/signal-src/SignalHunter/settings.gradle

      - name: Materialize canonical project
        shell: bash
        run: |
          set -euo pipefail
          rsync -a \
            --exclude README.md \
            --exclude VERIFICATION.json \
            /tmp/signal-src/SignalHunter/ ./
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/cory/signalhunter/ui/TraceView.java')
          s = p.read_text()
          old = '((double) (ms - first) / (last - first))'
          new = '((float) (ms - first) / (last - first))'
          if s.count(old) != 1:
              raise SystemExit('TraceView patch target count != 1')
          p.write_text(s.replace(old, new))
          PY
          grep -Fq '((float) (ms - first) / (last - first))' \
            app/src/main/java/com/cory/signalhunter/ui/TraceView.java
          rm -rf bootstrap
          rm .github/workflows/bootstrap-signal-hunter.yml

      - name: Commit canonical source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Add canonical Signal Hunter Android source'
          git push origin HEAD:main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run core tests
        run: bash tools/test-core.sh

      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" \
            | tee apk-badging.txt
          grep -q "package: name='com.cory.signalhunter'" apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose --print-certs "$APK" | tee apk-signature.txt
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SignalHunter-v0.1.0-debug-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-badging.txt
            apk-signature.txt
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
